  <circle cx="624" cy="185" r="24" fill="rgba(0,242,254,0.2)" stroke="#00f2fe" stroke-width="2" />
  <text x="614" y="191" fill="#00f2fe" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="13">S3</text>
  
